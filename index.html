<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 30% 20%,#7a2155,#2b0f24 70%);color:#fff0f5;font-family:"Hind Siliguri",system-ui,sans-serif;overflow-x:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;padding:28px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s}
.scr.show{opacity:1;pointer-events:auto}
h1{font-family:"Playfair Display",serif;font-style:italic;font-size:clamp(34px,9vw,58px);margin:10px 0;color:#ffb3cd;text-shadow:0 0 24px #e83e6c88}
h2{color:#ffb3cd;margin:0 0 8px}
.sub{color:#e9b8c9;margin:0 0 20px}
button{font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,#ff5c8a,#e83e6c);border:0;border-radius:999px;padding:12px 28px;cursor:pointer;box-shadow:0 8px 24px #e83e6c66;transition:transform .2s}
button:active{transform:scale(.95)}
.gift{font-size:110px;cursor:pointer;animation:pulse 1.6s infinite;filter:drop-shadow(0 0 30px #ff5c8a)}
.gift.open{animation:pop .7s forwards}
@keyframes pulse{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
@keyframes pop{to{transform:scale(3);opacity:0}}
.lines{max-width:480px;margin:18px 0}
.lines p{font-size:19px;margin:12px 0;opacity:0;transform:translateY(16px);transition:all 1s}
.lines p.in{opacity:1;transform:none}
.hid{opacity:0;pointer-events:none;transition:opacity 1s}.hid.in{opacity:1;pointer-events:auto}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;max-width:460px;width:100%;margin:10px 0 24px}
.pol{background:#fff;padding:8px 8px 26px;border-radius:6px;box-shadow:0 10px 30px #0008;transform:rotate(var(--r));aspect-ratio:3/4;position:relative;color:#b0517a}
.pol:nth-child(1){--r:-4deg}.pol:nth-child(2){--r:3deg}.pol:nth-child(3){--r:2deg}.pol:nth-child(4){--r:-3deg}
.pol img{width:100%;height:100%;object-fit:cover;border-radius:3px;display:block}
.ph{position:absolute;inset:8px 8px 26px;display:flex;align-items:center;justify-content:center;background:#ffe3ec;border-radius:3px;font-size:13px;z-index:0}
.pol img{position:relative;z-index:1}
.card{background:#ffffff14;border:1px solid #ffffff30;backdrop-filter:blur(8px);border-radius:22px;padding:24px;max-width:460px;width:100%}
.card h2{font-size:22px;line-height:1.4}
textarea{width:100%;font:inherit;color:#fff;background:#0004;border:1px solid #ffffff40;border-radius:14px;padding:12px;margin:14px 0;resize:none}
.dots{margin-bottom:10px;color:#ff8fb1}
.heart{position:fixed;bottom:-30px;pointer-events:none;animation:up linear forwards;z-index:0}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style>
</head>
<body>
<canvas id="cf"></canvas>

<!-- 0: Gift -->
<section class="scr show" id="s0">
  <!-- <p class="sub">তোমার জন্য একটা ছোট্ট surprise আছে 💝</p> -->
  <div class="gift" id="gift">🎁</div>
  <p class="sub">Gift ta e tap koro</p>
</section>

<!-- 1: Wish -->
<section class="scr" id="s1">
  <h1 id="title"></h1>
  <div class="lines" id="lines"></div>
  <button class="hid" id="n1">Next →</button>
</section>

<!-- 2: Photos -->
<section class="scr" id="s2">
  <h2>Many, many happy returns of the day with your pretty looks 
 📸</h2>
  <div class="gal">

    <!-- ===== PHOTO 1 ===== chobir naam niche src="..." e likho (jemon photos/amra.jpg) -->
    <div class="pol">
      <div class="ph">📷 Photo 1</div>
      <img src="image/Screenshot_3.png" alt="" onerror="this.remove()">
    </div>

    <!-- ===== PHOTO 2 ===== -->
    <div class="pol">
      <div class="ph">📷 Photo 2</div>
      <img src="image/Screenshot_1.png" alt="" onerror="this.remove()">
    </div>

    <!-- ===== PHOTO 3 ===== -->
    <div class="pol">
      <div class="ph">📷 Photo 3</div>
      <img src="image/515440140_122105212622927274_8445700067289951102_n.jpg" alt="" onerror="this.remove()">
    </div>

    <!-- ===== PHOTO 4 ===== -->
    <div class="pol">
      <div class="ph">📷 Photo 4</div>
      <img src="image/Screenshot_2.png" alt="" onerror="this.remove()">
    </div>

    <!-- aro chobi lagle upore ekta <div class="pol">...</div> block copy kore ekhane paste koro -->
  </div>
  <button id="n2">Next? →</button>
</section>

<!-- 3: Quiz -->
<section class="scr" id="s3">
  <div class="card">
    <div class="dots" id="dots"></div>
    <h2 id="qt"></h2>
    <textarea id="qa" rows="3" placeholder="তোমার উত্তর লেখো…"></textarea>
    <button id="qn">Next →</button>
  </div>
</section>

<!-- 4: End -->
<section class="scr" id="s4">
  <div style="font-size:80px">💖</div>
  <h1>Thank you, <span class="nm"></span>!</h1>
  <p class="sub">তোমার উত্তরগুলো আমি পেয়ে গেছি 😘</p>
</section>

<script type="module">
// ================= EDIT HERE =================
const NAME = "Shreeparna";                 // tomar gf er naam
const TITLE = "Happy Birthday";
const LINES = [
  "Ajker diner janno tumk ank ank shovokamona 🌸",
  "Jodi o tumi amk patta dao na.....tbuou assirbad kori tumi jeno Vhalo ekta manus ke pao😊 (mone mone ovhisap o disi)",
  "Shuke thako, vhalo thako, Hasikushi tako",
  "Happy Birthday! ❤️",
  "— tumar Chudu vhai"
];
const QUESTIONS = [
  "Eto kasto kore wish korlam, klk treat diba kina balo?",
  "Amk dheklei ki tumar mejaj garom hoye jai? muk ta firiye nao je omon kore?",
  "Tumar ma er sate ota tumr sister chilo?"
];
const ACCESS_KEY = "ddf3492d-0ec0-4934-ae0b-13010ab15bf2";   // web3forms.com theke pawa key (answer tomar email e ashbe)
// =============================================

const $ = id => document.getElementById(id);
document.querySelectorAll(".nm").forEach(e => e.textContent = NAME);
const go = n => { document.querySelectorAll(".scr").forEach((s,i) => s.classList.toggle("show", i===n)); };
const wait = ms => new Promise(r => setTimeout(r, ms));

// confetti + hearts
const cv=$("cf"),cx=cv.getContext("2d");let ps=[];
const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener("resize",fit);
function boom(){for(let i=0;i<180;i++)ps.push({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*16,vy:Math.random()*-14-2,c:`hsl(${330+Math.random()*50},90%,${60+Math.random()*20}%)`,s:5+Math.random()*7,l:170})}
(function loop(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)});requestAnimationFrame(loop)})();
function hearts(){setInterval(()=>{const h=document.createElement("div");h.className="heart";h.textContent=["💖","💗","💕","🌸"][Math.random()*4|0];h.style.left=Math.random()*100+"vw";h.style.fontSize=14+Math.random()*22+"px";h.style.animationDuration=6+Math.random()*6+"s";document.body.appendChild(h);setTimeout(()=>h.remove(),12000)},600)}

// 0 -> 1 : gift opens, wish appears
$("gift").onclick = async () => {
  $("gift").classList.add("open"); boom(); hearts();
  await wait(900); go(1);
  $("title").textContent = TITLE + ", " + NAME + "! 💖";
  await wait(1200);
  for (const t of LINES) { const p=document.createElement("p"); p.textContent=t; $("lines").appendChild(p); await wait(60); p.classList.add("in"); await wait(1500); }
  boom(); $("n1").classList.add("in");
};
$("n1").onclick = () => go(2);

// photos
$("n2").onclick = () => { go(3); showQ(); };

// quiz
let qi = 0;
function showQ() {
  $("dots").textContent = QUESTIONS.map((_,i) => i<=qi ? "💗" : "🤍").join(" ");
  $("qt").textContent = QUESTIONS[qi];
  $("qa").value = "";
  $("qn").textContent = qi === QUESTIONS.length-1 ? "Submit 💌" : "Next →";
}
const got = [];
$("qn").onclick = async () => {
  const a = $("qa").value.trim(); if (!a) { $("qa").focus(); return; }
  got.push(`${qi+1}. ${QUESTIONS[qi]}\n➜ ${a}`);
  if (++qi < QUESTIONS.length) { showQ(); return; }
  $("qn").disabled = true;
  const body = got.join("\n\n");
  try {
    if (ACCESS_KEY === "YOUR_ACCESS_KEY") console.log("DEMO (key nai):\n" + body);
    else {
      const r = await fetch("https://api.web3forms.com/submit", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({access_key:ACCESS_KEY, subject:"💌 " + NAME + " quiz er uttor dilo!", message:body})});
      if (!(await r.json()).success) throw 0;
    }
  } catch(e) { alert("Pathano jachche na, internet check kore abar Submit koro 😢"); $("qn").disabled=false; qi--; got.pop(); return; }
  go(4); boom();
};
</script>
</body>
</html>
